version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kamerinos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Colombia2026*}
      POSTGRES_DB: ${POSTGRES_DB:-kamerinos_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kamerinos_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kamerinos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kamerinos_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kamerinos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-Colombia2026*}@postgres:5432/${POSTGRES_DB:-kamerinos_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://kamerinosspa.com}
      API_PREFIX: api
      RUN_SEED: ${RUN_SEED:-false}
    networks:
      - kamerinos_net

  frontend:
    build:
      context: ../saaspa-frontend
      dockerfile: Dockerfile
    container_name: kamerinos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    networks:
      - kamerinos_net

  nginx:
    image: nginx:stable-alpine
    container_name: kamerinos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/kamerinos.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - kamerinos_net

volumes:
  pg_data:
  redis_data:

networks:
  kamerinos_net:
    driver: bridge
